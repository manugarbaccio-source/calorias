name: Sincronizar Garmin

on:
  schedule:
    - cron: "10 * * * *"   # cada hora, minuto 10
  workflow_dispatch:        # y a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install garminconnect requests

      - name: Recuperar tokens de Garmin (cache)
        uses: actions/cache@v4
        with:
          path: ~/.garmin_tokens
          key: garmin-tokens-v1

      - name: Escribir configuración
        run: |
          cat > garmin-sync/config.json <<EOF
          {"supabase_url": "${{ secrets.SUPABASE_URL }}", "supabase_key": "${{ secrets.SUPABASE_KEY }}", "token_dir": "~/.garmin_tokens"}
          EOF

      - name: Sincronizar
        env:
          TZ: America/Argentina/Buenos_Aires
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python garmin-sync/sync.py
